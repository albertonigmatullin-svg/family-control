name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-child:
    name: Build Child APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Write google-services.json
        run: |
          SECRET='${{ secrets.GOOGLE_SERVICES_JSON }}'
          if [ -n "$SECRET" ] && [ ${#SECRET} -gt 10 ]; then
            echo "$SECRET" > child-app/app/google-services.json
            echo "google-services.json written from secret"
          else
            echo "Warning: GOOGLE_SERVICES_JSON secret not set or empty, using placeholder from repo"
          fi

      - name: Setup Gradle wrapper
        working-directory: child-app
        run: gradle wrapper --gradle-version 8.4

      - name: Build debug APK
        working-directory: child-app
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Child APK
        uses: actions/upload-artifact@v4
        with:
          name: family-control-child-debug
          path: child-app/app/build/outputs/apk/debug/app-debug.apk

  build-parent:
    name: Build Parent APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Write google-services.json
        run: |
          SECRET='${{ secrets.GOOGLE_SERVICES_JSON_PARENT }}'
          if [ -n "$SECRET" ] && [ ${#SECRET} -gt 10 ]; then
            echo "$SECRET" > parent-app/app/google-services.json
            echo "google-services.json written from secret"
          else
            echo "Warning: GOOGLE_SERVICES_JSON_PARENT secret not set or empty, using placeholder from repo"
          fi

      - name: Setup Gradle wrapper
        working-directory: parent-app
        run: gradle wrapper --gradle-version 8.4

      - name: Build debug APK
        working-directory: parent-app
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Parent APK
        uses: actions/upload-artifact@v4
        with:
          name: family-control-parent-debug
          path: parent-app/app/build/outputs/apk/debug/app-debug.apk
