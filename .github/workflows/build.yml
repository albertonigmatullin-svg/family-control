name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-child:
    name: Build Child APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > child-app/app/google-services.json

      - name: Setup Gradle wrapper
        working-directory: child-app
        run: gradle wrapper --gradle-version 8.4

      - name: Build debug APK
        working-directory: child-app
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Child APK
        uses: actions/upload-artifact@v4
        with:
          name: family-control-child-debug
          path: child-app/app/build/outputs/apk/debug/app-debug.apk
